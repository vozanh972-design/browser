[package]
name = "autolunex"
version = "1.0.2"
description = "Desktop App"
edition = "2021"
default-run = "autolunex"

[lib]
name = "autolunex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[[bin]]
name = "autolunex"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
log = "0.4"
hmac = "0.12"
sha2 = "0.10"
obfstr = "0.4"
zeroize = "1"

# tauri-plugin-window-state removed: saves state files to disk (violates no-file policy)
# tauri-plugin-log removed: writes log files to disk (violates no-file policy)

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
