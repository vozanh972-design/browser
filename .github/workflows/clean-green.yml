name: Xóa các Workflow đã xanh

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Xóa các run đã hoàn thành thành công (success)
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              status: 'success',
              per_page: 100
            });
            console.log(`Tìm thấy ${runs.length} workflow màu xanh (success). Bắt đầu xóa thật trên GitHub...`);
            for (const run of runs) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
                console.log(`✓ Đã xóa xong run #${run.id} (${run.name})`);
              } catch (err) {
                console.error(`Không thể xóa #${run.id}:`, err.message);
              }
            }
            console.log("Hoàn tất dọn dẹp!");
