name: Dọn dẹp lịch sử Workflow (Xanh / Đỏ)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Chọn loại workflow muốn xóa:'
        required: true
        type: choice
        default: 'all_completed'
        options:
          - 'all_completed' # Xóa cả Xanh và Đỏ (đã xong)
          - 'only_green'    # Chỉ xóa màu Xanh (thành công)
          - 'only_red'      # Chỉ xóa màu Đỏ (thất bại / lỗi)

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Xóa các run đã chọn
        uses: actions/github-script@v7
        with:
          script: |
            const target = '${{ github.event.inputs.target }}';
            console.log(`Chế độ đã chọn: ${target}`);

            // Lấy toàn bộ các workflow đã hoàn thành (status: completed)
            // TUYỆT ĐỐI KHÔNG LẤY các workflow đang chạy (in_progress, queued)
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              status: 'completed',
              per_page: 100
            });

            // Lọc theo lựa chọn của người dùng
            const toDelete = runs.filter(run => {
              if (target === 'only_green') return run.conclusion === 'success';
              if (target === 'only_red') return run.conclusion === 'failure' || run.conclusion === 'cancelled';
              return true; // all_completed: xóa cả xanh và đỏ
            });

            console.log(`Tìm thấy ${toDelete.length} workflow phù hợp để xóa. Bắt đầu xóa thật trên GitHub...`);

            for (const run of toDelete) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
                console.log(`✓ Đã xóa run #${run.id} (${run.name} - ${run.conclusion})`);
              } catch (err) {
                console.error(`Không thể xóa #${run.id}:`, err.message);
              }
            }
            console.log("Hoàn tất dọn dẹp!");
